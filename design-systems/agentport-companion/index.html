<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <title>agentport Companion</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="nav">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><img src="assets/agentport-mark.svg" alt=""></span>
        <div class="brand-copy">
          <h1 class="h1">agentport Companion</h1>
          <p class="t2">Manage your connection and the ports it opens</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="connection-pill"><span class="status-dot"></span> Tunnel connected</span>
        <span class="updated">Updated at Sep 28, 2026, 2:10 PM</span>
      </div>
    </header>

    <div class="dashboard-grid">
      <aside class="sidebar" aria-label="Companion status">
        <section class="section-card status-section">
          <div class="section-heading">
            <div><p class="eyebrow">OVERVIEW</p><h2 class="h2">Companion status</h2></div>
            <span class="live-indicator" aria-label="Active"></span>
          </div>
          <dl class="status-list">
            <div class="status-row"><dt>Profile</dt><dd>vortx</dd></div>
            <div class="status-row"><dt>Server</dt><dd>vortx</dd></div>
            <div class="status-row"><dt>Tunnel</dt><dd class="positive">Connected</dd></div>
          </dl>
        </section>

        <section class="section-card stop-card">
          <div><h2 class="stop-title">End session</h2><p class="muted">Disconnects this Companion from the server.</p></div>
          <button class="btn btn-danger" type="button">Stop Companion</button>
        </section>
      </aside>
    </div>
    <footer class="footer"><span>agentport Companion</span><span>Protected connection <span class="footer-dot"></span></span></footer>
  </main>
</body>
</html>

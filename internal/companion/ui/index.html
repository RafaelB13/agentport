<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101214">
  <meta name="agentport-base" content="{{BASE}}">
  <meta name="agentport-lang" content="{{LANG}}">
  <meta name="agentport-i18n" content="{{I18N}}">
  <title>agentport Companion</title>
  <link rel="icon" type="image/svg+xml" href="{{BASE}}/assets/favicon.svg">
  <link rel="stylesheet" href="{{BASE}}/assets/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="nav">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"><img src="{{BASE}}/assets/agentport-mark.svg" alt=""></span>
        <div class="brand-copy"><h1 class="h1">agentport Companion</h1><p class="t2">{{t:Keep the connection to your server running}}</p></div>
      </div>
      <div class="header-meta"><span class="connection-pill" id="connection">{{t:Connecting…}}</span><span class="updated" id="updated">{{t:Loading…}}</span></div>
    </header>
    <div class="dashboard-grid">
      <aside class="sidebar" aria-label="{{t:Companion status}}">
        <section class="section-card status-section">
          <div class="section-heading"><div><p class="eyebrow">{{t:OVERVIEW}}</p><h2 class="h2">{{t:Companion status}}</h2></div><span class="live-indicator" id="live-indicator" aria-label="{{t:Connecting}}"></span></div>
          <dl class="status-list" id="status"></dl>
        </section>
        <section class="section-card stop-card"><div><h2 class="stop-title">{{t:End session}}</h2><p class="muted">{{t:Disconnects this Companion from the server.}}</p></div><button class="btn btn-danger" type="button" id="stop">{{t:Stop Companion}}</button></section>
      </aside>
    </div>
    <footer class="footer"><span>agentport Companion</span><span>{{t:Protected connection}} <span class="footer-dot"></span></span></footer>
  </main>
<script src="{{BASE}}/assets/app.js"></script>
</body>
</html>
